<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />

        <!-- Responsividade -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

        <title>Projects Manager</title>

        <!-- Estilos da navbar -->
        <link rel="stylesheet" href="navbar.css" />

        <!-- Carregado depois do HTML -->
        <script src="navbar.js" defer></script>
    </head>

    <body>
        <!-- Cabeçalho principal da aplicação -->
        <header class="header-menu">
            <!-- Ícone/nome da aplicação preenchido pelo JavaScript -->
        </header>

        <!-- Área principal de navegação -->
        <nav id="menu-options" aria-label="Navegação principal">
            <section class="container-buttons">
                <!--
                    Área de pesquisa e gerenciamento.
                    Os inputs podem futuramente ser conectados
                    ao sistema de filtros da aplicação.
                -->
                <div class="text-area">
                    <!-- Pesquisa -->
                    <article class="text-pesquise">
                        <img
                            src="../../../src/assets/icons/pesquise.png"
                            alt=""
                            aria-hidden="true"
                        />

                        <input
                            type="search"
                            placeholder="Pesquise..."
                            aria-label="Pesquisar projetos"
                        />
                    </article>

                    <!-- Gerenciamento de projetos -->
                    <article class="text-gerir">
                        <img src="../../../src/assets/icons/gerir.png" alt="" aria-hidden="true" />

                        <input
                            type="search"
                            placeholder="Gerir Projetos..."
                            aria-label="Gerir projetos"
                        />
                    </article>

                    <!-- Filtros -->
                    <article class="text-filtrar">
                        <img src="../../../src/assets/icons/filtro.png" alt="" aria-hidden="true" />

                        <input
                            type="search"
                            placeholder="Filtrar..."
                            aria-label="Filtrar projetos"
                        />
                    </article>
                </div>

                <!--
                    Ações de gerenciamento.
                    Os IDs são mantidos para compatibilidade
                    com o navbar.js.
                -->
                <div class="botões-de-gerenciamento">
                    <!-- Projetos recentes -->
                    <article class="recentes-button">
                        <button id="recentes" type="button">
                            <img
                                src="../../../src/assets/icons/recente.png"
                                alt=""
                                aria-hidden="true"
                            />

                            <span>Recentes</span>
                        </button>
                    </article>

                    <!-- Pessoas envolvidas -->
                    <article class="pessoas-button">
                        <button id="pessoas" type="button">
                            <img
                                src="../../../src/assets/icons/do-utilizador.png"
                                alt=""
                                aria-hidden="true"
                            />

                            <span>Pessoas</span>
                        </button>
                    </article>

                    <!-- Ordenação -->
                    <article class="ordem-button">
                        <button id="ordenar" type="button">
                            <img
                                src="../../../src/assets/icons/ordenar.png"
                                alt=""
                                aria-hidden="true"
                            />

                            <span>Ordenar</span>
                        </button>
                    </article>

                    <!-- Ocultar informações -->
                    <article class="ocultar-button">
                        <button id="ocultar" type="button">
                            <img
                                src="../../../src/assets/icons/ocultar.png"
                                alt=""
                                aria-hidden="true"
                            />

                            <span>Ocultar</span>
                        </button>
                    </article>
                </div>

                <!-- Configuração do usuário -->
                <div class="user-configuration">
                    <article class="perfil-usuario">
                        <button
                            id="user-perfil"
                            type="button"
                            class="icon-button"
                            aria-label="Perfil do usuário"
                        >
                            <img
                                src="../../../src/assets/icons/pessoa.png"
                                alt=""
                                aria-hidden="true"
                            />
                        </button>
                    </article>
                </div>
            </section>
        </nav>
    </body>
</html>
