<!-- <!DOCTYPE html> -->
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Projects Manager</title>
    <link rel='stylesheet' href='../layout/index.css'>
</head>
<body>
    <header class="header-menu">
        <!--Icone Aplicação-->  
    </header> 

    <div id="menu-options">
        <section class="container-buttons">
            <div class="text-area">
                    <!--Botão de Pesquisa-->
                <article class="text-pesquise">
                    <input type="text" placeholder="Pesquise 🔎">
                </article>

                    <!--Gerir todos os Projetos-->
                <article>
                    <input type="text" placeholder="Gerir Todos os Projetos">
                </article>
            </div>
        </section>
    </div>

    <div class="container-inicial">
        <section class="container-dashboards">
                    <!-- Lista de Projetos + Status / Resumo -->
            <div class="container-list-projects">
                <article class="list-projects">
                    <h2>Seus Projetos</h2>
                    <div class="activity-list-projects">
                        <!-- Conteúdo preenchido dianamicamente via JS-->
                    </div>
                </article>
            </div>
                
                <!-- status de tarefas / Grafico linha -->
            <div class="container-cards-graphics">
                <article class="card card-statusTask">
                    <h2>Status por Tarefas</h2>
                    <div id="activity-graphicStatus">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>

                <article class="card card-person">
                    <h2>Tarefa por Responsavel</h2>
                    <div id="activity-graphicPerson">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>

                <article class="card card-taskTemp">
                    <h2>Tarefas Atrasadas</h2>
                    <div id="acitivty-graphicsTask">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>
            </div>

                <!-- Grafico em Linha -->
            <div>
                <article class="card-evolutionCommits">
                    <h2>Commits Diarios</h2>
                    <div id="activity-grafic-commit">
                        <!-- Conteudo preenchido dinamicamente via JS--->
                    </div>
                </article>
            </div>

                <!-- Calendario de Atividades-->
            <div class="calendar-graphics">
                <article class="card-calendar">
                <h2>Calendario</h2>
                <div id="activity-calendar"></div>
                    <!-- Conteudo preenchido dinamicamente via JS-->
            </article>
            </div>
        </section>
    </div>
</body>
</html>
