<!-- <!DOCTYPE html> -->
<html lang='pt-BR'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Projects Manager</title>
    <link rel='stylesheet' href='../layout/index.css'>
</head>
<body>
    <header class="header-menu">
        <!--Icone Aplicação-->  
    </header> 

    <div id="menu-options">
        <section class="container-buttons">
            <div class="text-area">

                    <!--Botão de Pesquisa-->
                <article class="text-pesquise">
                    <img src="../../src/assets/icons/pesquise.png">
                    <input type="text" placeholder="Pesquise...">
                </article>

                    <!--Gerir todos os Projetos-->
                <article class="text-gerir">
                    <img src="../../src/assets/icons/gerir.png">
                    <input type="text" placeholder="Gerir Todos os Projetos...">
                </article>

                    <!--Filtra informações de acordo com as necessidades do usuario-->
                <article class="text-filtrar">
                    <img src="../../src/assets/icons/filtro.png">
                    <input type="text" placeholder="Filtrar...">
                </article>

            </div>

            <div class="botões-de-gerenciamento">
                    <!--Botão que Apresenta os projetos mais recentes do usuario-->
                <article class="recentes-button">
                    <button id="recentes" type="button">
                        <img src="../../src/assets/icons/recente.png">
                        Recentes
                    </button>
                </article>

                    <!--Botão que exibe pessoas trabalhando nos projetos-->
                <article class="pessoas-button">
                    <button id="pessoas" type="button">
                        <img src="../../src/assets/icons/do-utilizador.png">
                        Pessoas                        
                    </button>
                </article>

                    <!--Botão de ordenação de entidades-->
                <article class="ordem-button">
                    <button id="ordenar" type="button">
                        <img src="../../src/assets/icons/ordenar.png">
                        Ordenar
                    </button>
                </article>

                    <!--Botão de ocultar informações indesejadas pelo usuario-->
                <article class="ocultar-button">
                    <button id="ocultar" type="button">
                        <img src="../../src/assets/icons/ocultar.png">
                        Ocultar
                    </button>
                </article>
            </div>

            <div class="user-configuration">
                <article class="perfil-usuario">
                    <button id="user-perfil" type="button" class="icon-button">
                        <img src="../../src/assets/icons/pessoa.png">
                    </button>
                </article>
            </div>

        </section>
    </div>

        <!--Pop Ups-->
    <div class="container-popup">
        <section class="PopUps-containers">
            <!--Icone de Usuario-->
            <div class="icon-perfil">
                <!--Conteudo Preenchido Automaticamente com JS-->
            </div>

            <!--PopUp Menu Usuario + Botões do PopUP Presentes no Menu Usuario-->
            <div class="Buttons-PopUp-User">
                <article class="button-config">
                    <button type="button" id="configurações">
                        <img src="../../src/assets/icons/configuracoes.png">
                        Configurações
                    </button>
                </article>

                <article class="button-archive">
                    <button type="button" id="arquivar">
                        <img src="../../src/assets/icons/arquivar.png">
                        Arquivar
                    </button>
                </article>

                <article class="button-trash">
                    <button type="button" id="lixeira">
                        <img src="../../src/assets/icons/lixeira.png">
                        Lixeira
                    </button>
                </article>

                <article class="button-sair">
                    <button type="button" id="sair">
                        <img src="../../src/assets/icons/sair.png">
                        Sair
                    </button>
                </article>

                <article class="button-theme">
                    <button type="button" id="alterar-tema">
                        <img src="../../src/assets/icons/brilho-do-sol.png">
                        Alterar Tema
                    </button>
                </article>

                <article class="button-idioma">
                    <button type="button" id="linguagem-usuario">
                        <img src="../../src/assets/icons/idioma.png">
                        Idioma
                    </button>
                </article>

                <article class="button-feedback">
                    <button type="button" id="feedback">
                        <img src="../../src/assets/icons/feedback.png">
                        Der-nos seu Feedback
                    </button>
                </article>
            </div>
        </section>
    </div>


    <div class="container-inicial">
        <section class="container-dashboards">
                    <!-- Lista de Projetos + Status / Resumo -->
            <div class="container-list-projects">
                <article class="list-projects">
                    <h2>Seus Projetos</h2>
                    <div class="activity-list-projects">
                        <!-- Conteúdo preenchido dianamicamente via JS-->
                    </div>
                </article>
            </div>
                
                <!-- status de tarefas / Grafico linha -->
            <div class="container-cards-graphics">
                <article class="card card-statusTask">
                    <h2>Status por Tarefas</h2>
                    <div id="activity-graphicStatus">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>

                <article class="card card-person">
                    <h2>Tarefa por Responsavel</h2>
                    <div id="activity-graphicPerson">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>

                <article class="card card-taskTemp">
                    <h2>Tarefas Atrasadas</h2>
                    <div id="acitivty-graphicsTask">
                        <!-- Conteúdo preenchido dinamicamente via JS-->
                    </div>
                </article>
            </div>

                <!-- Grafico em Linha -->
            <div>
                <article class="card-evolutionCommits">
                    <h2>Commits Diarios</h2>
                    <div id="activity-grafic-commit">
                        <!-- Conteudo preenchido dinamicamente via JS--->
                    </div>
                </article>
            </div>

                <!-- Calendario de Atividades-->
            <div class="calendar-graphics">
                <article class="card-calendar">
                    <h2>Calendario</h2>
                    <div id="activity-calendar">
                        <!-- Conteudo preenchido dinamicamente via JS-->
                    </div>
                </article>
            </div>
        </section>
    </div>
</body>
</html>
