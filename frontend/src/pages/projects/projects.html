<html lang="pt-BR">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Projects Manager</title>
    <link rel='stylesheet' href='projects.css'>
    <script src="projects.js"></script>
</head>
<body>
    <div class="navbar">
        <!--Preenchido Automaticamente com JS-->
    </div>

    <div class="container-inicial">
        <section class="projects">
                <!--Exibição Dos Projetos-->
                <article class="List-commit">
                    <!--Preenchido automaticamente com JS-->
                </article>

                <article class="calendar">
                    <!--Preenchido automaticamente com JS-->
                </article>
        </section>

            <!--Exibição de Três Graficos-->
        <section class="graphics">
            <article class="linguagens-utilizadas">
                <div class="chart-header">
                    <h3>Linguagens Utilizadas</h3>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container donut-container">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>

            <article class="contribuição-pessoa">
                <div class="chart-header">
                    <h3>Contribuição Por Pessoa</h3>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container donut-container">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>

            <article class="Progresso">
                <div class="chart-header">
                    <h3>Progresso</h3>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container donut-container">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>
        </section>
    </div>
</body>
</html>
