<html lang="pt-BR">
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Projects Manager</title>
    <link rel='stylesheet' href='projects.css'>
    <script src="projects.js"></script>
</head>
<body>
    <div class="navbar">
        <!--Preenchido Automaticamente com JS-->
    </div>

    <div class="container-inicial">
        <section class="container-projects">
                <!--Exibição Dos Projetos-->
                <article class="list-commit">
                    <div class="title-ci"><h3>Seus Commits</h3></div>
                    <div class="activity-list-commits">
                        <!--Preenchido automaticamente com JS-->
                    </div>
                </article>

                <article class="calendar">
                    <div class="title-ci"><h3>Calendario</h3></div>
                    <div class="calendar-activity">
                        <!--Preenchido automaticamente com JS-->
                    </div>
                </article>
        </section>

            <!--Exibição de Três Graficos-->
        <section class="container-graphics">
            <article class="linguagens-utilizadas">
                <div class="chart-header">
                    <div class="title-cg"><h3>Linguagens Utilizadas</h3></div>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container-lenguage">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>

            <article class="contribuicao-pessoa">
                <div class="chart-header">
                    <div class="title-cg"><h3>Contribuição Por Pessoa</h3></div>
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container-pessoa">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>

            <article class="progresso">
                <div class="chart-header">
                    <div class="title-cg"><h3>Progresso</h3></div> 
                    <span class="metric-value" id="completion-ratio">-- / --</span>
                </div>
                <div class="chart-container-progresso">
                    <svg class="donut-chart-svg" viewBox="0 0 100 100">
                        <!-- Círculo de Fundo -->
                        <circle class="donut-bg" cx="50" cy="50" r="40" />
                        <!-- Círculo de Progresso -->
                        <circle class="donut-segment" cx="50" cy="50" r="40" />
                    </svg>
                </div>
            </article>
        </section>
    </div>
</body>
</html>
