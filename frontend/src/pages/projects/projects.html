<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Projects Manager</title>
        <!-- Estilos da página -->
        <link rel="stylesheet" href="projects.css" />
        <!--
        defer faz o JavaScript carregar sem bloquear a construção
        do HTML e executar somente depois que o documento estiver disponível.
    -->
        <script src="projects.js" defer></script>
    </head>

    <body>
        <!--
        Barra de navegação.
        O conteúdo é inserido dinamicamente pelo projects.js.
    -->
        <nav class="navbar" aria-label="Navegação principal">
            <!-- Preenchido automaticamente com JS -->
        </nav>
        <!--
        Container principal da página.

        A arquitetura original foi preservada:
        container-inicial
        ├── container-projects
        │   ├── list-commit
        │   └── calendar
        │
        └── container-graphics
            ├── linguagens-utilizadas
            ├── contribuicao-pessoa
            └── progresso
    -->
        <main class="container-inicial">
            <!-- =========================================================
             PROJETOS / ATIVIDADES
             ========================================================= -->

            <section class="container-projects" aria-label="Atividades do projeto">
                <!-- Lista de commits -->
                <article class="list-commit">
                    <header class="title-ci">
                        <h2>Seus commits</h2>
                    </header>
                    <div
                        class="activity-list-commits"
                        id="activity-list-commits"
                        aria-label="Lista de commits"
                    >
                        <!-- Preenchido automaticamente com JS -->
                    </div>
                </article>

                <!-- Calendário -->
                <article class="calendar">
                    <header class="title-ci">
                        <h2>Calendário</h2>
                    </header>
                    <div
                        class="calendar-activity"
                        id="calendar-activity"
                        aria-label="Calendário de atividades"
                    >
                        <!-- Preenchido automaticamente com JS -->
                    </div>
                </article>
            </section>

            <!-- =========================================================
             GRÁFICOS
             ========================================================= -->
            <section class="container-graphics" aria-label="Estatísticas do projeto">
                <!-- =====================================================
                 GRÁFICO: LINGUAGENS UTILIZADAS
                 ===================================================== -->

                <article class="graphic-card linguagens-utilizadas">
                    <header class="chart-header">
                        <div class="title-cg">
                            <h2>Linguagens utilizadas</h2>
                        </div>
                        <!--
                        ID exclusivo.
                        IDs duplicados foram removidos para facilitar
                        o controle pelo JavaScript.
                    -->
                        <span class="metric-value" id="language-ratio"> -- / -- </span>
                    </header>

                    <div class="chart-container">
                        <svg
                            class="donut-chart-svg"
                            viewBox="0 0 100 100"
                            role="img"
                            aria-label="Distribuição das linguagens utilizadas"
                        >
                            <!-- Círculo de fundo -->
                            <circle class="donut-bg" cx="50" cy="50" r="40" />
                            <!-- Círculo de progresso -->
                            <circle
                                class="donut-segment"
                                id="language-progress"
                                cx="50"
                                cy="50"
                                r="40"
                            />
                        </svg>
                    </div>
                </article>

                <!-- =====================================================
                 GRÁFICO: CONTRIBUIÇÃO POR PESSOA
                 ===================================================== -->

                <article class="graphic-card contribuicao-pessoa">
                    <header class="chart-header">
                        <div class="title-cg">
                            <h2>Contribuição por pessoa</h2>
                        </div>

                        <span class="metric-value" id="contribution-ratio"> -- / -- </span>
                    </header>

                    <div class="chart-container">
                        <svg
                            class="donut-chart-svg"
                            viewBox="0 0 100 100"
                            role="img"
                            aria-label="Contribuição por pessoa"
                        >
                            <!-- Círculo de fundo -->
                            <circle class="donut-bg" cx="50" cy="50" r="40" />
                            <!-- Círculo de progresso -->
                            <circle
                                class="donut-segment"
                                id="contribution-progress"
                                cx="50"
                                cy="50"
                                r="40"
                            />
                        </svg>
                    </div>
                </article>

                <!-- =====================================================
                 GRÁFICO: PROGRESSO
                 ===================================================== -->

                <article class="graphic-card progresso">
                    <header class="chart-header">
                        <div class="title-cg">
                            <h2>Progresso</h2>
                        </div>
                        <span class="metric-value" id="project-progress-ratio"> -- / -- </span>
                    </header>

                    <div class="chart-container">
                        <svg
                            class="donut-chart-svg"
                            viewBox="0 0 100 100"
                            role="img"
                            aria-label="Progresso do projeto"
                        >
                            <!-- Círculo de fundo -->
                            <circle class="donut-bg" cx="50" cy="50" r="40" />
                            <!-- Círculo de progresso -->
                            <circle
                                class="donut-segment"
                                id="project-progress"
                                cx="50"
                                cy="50"
                                r="40"
                            />
                        </svg>
                    </div>
                </article>
            </section>
        </main>
    </body>
</html>
